<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Quill/pen icon representing campaign writing -->
  <g transform="translate(256,256) scale(0.6)">
    <path d="M-120,180 L-60,-120 Q-40,-180 20,-200 Q80,-220 140,-180 L180,-140 Q220,-80 200,-20 Q180,40 120,60 L-120,180 Z"
          fill="url(#accent)" opacity="0.9"/>
    <path d="M-120,180 L-80,80 L-20,140 Z" fill="#78350f"/>
    <line x1="-60" y1="-120" x2="120" y2="60" stroke="#0f172a" stroke-width="8" opacity="0.3"/>
    <line x1="-30" y1="-100" x2="140" y2="20" stroke="#0f172a" stroke-width="4" opacity="0.2"/>
  </g>
  <!-- Small stars/sparkles for magic -->
  <circle cx="380" cy="100" r="6" fill="#fbbf24" opacity="0.8"/>
  <circle cx="400" cy="140" r="4" fill="#fbbf24" opacity="0.6"/>
  <circle cx="350" cy="130" r="3" fill="#fbbf24" opacity="0.5"/>
</svg>
