
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D&D Campaign Weaver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.10.1/dist/style.css" />
    <style>
      body {
        font-family: 'Roboto', sans-serif;
      }
      h1, h2, h3, h4, .font-serif {
        font-family: 'Merriweather', serif;
      }

      /* -------------------------------------------------------
         Global scrollbar — stone-900 track, stone-600 thumb
      ------------------------------------------------------- */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1c1917; /* stone-900 */
      }
      ::-webkit-scrollbar-thumb {
        background: #44403c; /* stone-600 */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #57534e; /* stone-500 */
      }

      /* Legacy scoped scrollbar (kept for compatibility) */
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #1c1917;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #44403c;
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #57534e;
      }

      /* -------------------------------------------------------
         AI generation loading — quill-writing pulse
      ------------------------------------------------------- */
      @keyframes quill-writing {
        0%, 100% { opacity: 0.3; }
        50%       { opacity: 1;   }
      }
      .animate-quill {
        animation: quill-writing 1.5s ease-in-out infinite;
      }

      /* -------------------------------------------------------
         View / panel fade-in
      ------------------------------------------------------- */
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0);   }
      }
      .animate-fade-in {
        animation: fade-in 0.2s ease-out;
      }

      /* -------------------------------------------------------
         Warm amber focus glow for inputs and textareas
      ------------------------------------------------------- */
      .focus-amber:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px #78350f, 0 0 0 4px #f59e0b40;
      }

      /* -------------------------------------------------------
         Parchment-texture card background
      ------------------------------------------------------- */
      .card-parchment {
        background: linear-gradient(135deg, #1c1917 0%, #292524 50%, #1c1917 100%);
        position: relative;
        overflow: hidden;
      }
      .card-parchment::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 30% 40%, rgba(251, 191, 36, 0.02), transparent 60%);
        pointer-events: none;
      }

      /* -------------------------------------------------------
         tailwindcss-animate polyfill — animate-in + modifiers
         (Tailwind is loaded via CDN without the animate plugin)
      ------------------------------------------------------- */
      @keyframes tw-fade-in   { from { opacity: 0; }             to { opacity: 1; }            }
      @keyframes tw-zoom-in   { from { transform: scale(0.95); } to { transform: scale(1); }   }
      @keyframes tw-slide-in-from-bottom-2  { from { transform: translateY(0.5rem); }  to { transform: translateY(0); } }
      @keyframes tw-slide-in-from-bottom-4  { from { transform: translateY(1rem); }    to { transform: translateY(0); } }
      @keyframes tw-slide-in-from-bottom-8  { from { transform: translateY(2rem); }    to { transform: translateY(0); } }
      @keyframes tw-slide-in-from-bottom-10 { from { transform: translateY(2.5rem); }  to { transform: translateY(0); } }
      @keyframes tw-slide-in-from-right     { from { transform: translateX(100%); }    to { transform: translateX(0); } }
      @keyframes tw-slide-in-from-top-2     { from { transform: translateY(-0.5rem); } to { transform: translateY(0); } }
      @keyframes tw-slide-in-from-top-5     { from { transform: translateY(-1.25rem); } to { transform: translateY(0); } }

      /* Base .animate-in: no-op; modifier classes below apply the animation. */
      .animate-in { animation-fill-mode: both; }

      /* Modifier classes that combine with .animate-in */
      .animate-in.fade-in            { animation-name: tw-fade-in; }
      .animate-in.zoom-in-95         { animation-name: tw-fade-in, tw-zoom-in; }
      .animate-in.slide-in-from-bottom-2  { animation-name: tw-fade-in, tw-slide-in-from-bottom-2; }
      .animate-in.slide-in-from-bottom-4  { animation-name: tw-fade-in, tw-slide-in-from-bottom-4; }
      .animate-in.slide-in-from-bottom-8  { animation-name: tw-fade-in, tw-slide-in-from-bottom-8; }
      .animate-in.slide-in-from-bottom-10 { animation-name: tw-fade-in, tw-slide-in-from-bottom-10; }
      .animate-in.slide-in-from-right     { animation-name: tw-fade-in, tw-slide-in-from-right; }
      .animate-in.slide-in-from-top-2     { animation-name: tw-fade-in, tw-slide-in-from-top-2; }
      .animate-in.slide-in-from-top-5     { animation-name: tw-fade-in, tw-slide-in-from-top-5; }

      /* Duration helpers */
      .duration-150 { animation-duration: 150ms; }
      .duration-200 { animation-duration: 200ms; }
      .duration-300 { animation-duration: 300ms; }
      .duration-500 { animation-duration: 500ms; }

      /* React Flow Customizations */
      .react-flow__node {
        font-size: 12px;
        font-weight: 500;
        color: #e2e8f0;
      }
      .react-flow__attribution {
        background: transparent !important;
        color: #475569 !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.25.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
    "tailwind-merge": "https://aistudiocdn.com/tailwind-merge@^3.3.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.546.0",
    "immer": "https://aistudiocdn.com/immer@^10.1.3",
    "reactflow": "https://esm.sh/reactflow@11.10.1?external=react,react-dom",
    "dagre": "https://esm.sh/dagre@0.8.5",
    "d3": "https://esm.sh/d3@7.8.5"
  }
}
</script>
</head>
  <body class="bg-slate-950">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
