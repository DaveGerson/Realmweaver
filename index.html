
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RealmWeaver</title>
    <!--
      SECURITY: script-src is restricted to 'self' — no remote host may execute
      script in a page that holds campaign data and the user's gcpApiKey in
      localStorage. 'unsafe-inline'/'unsafe-eval' stay in place because
      @vitejs/plugin-react injects an inline react-refresh preamble in dev; they
      do not weaken the "no remote script origin" guarantee. connect-src allows
      ws:/wss: for the Vite HMR socket during development.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:;"
    />
    <link rel="stylesheet" href="/index.css" />
    <style>
      /*
       * Font stacks: the Google Fonts <link> that used to load Roboto/
       * Merriweather was removed as part of the CDN-Tailwind security fix
       * (finding #29) and the fonts were not self-hosted, so naming them
       * here would just fall through to the next stack entry on every load.
       * These are plain system-font stacks — no remote font request is made.
       */
      body {
        font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      }
      h1, h2, h3, h4, .font-serif {
        font-family: Georgia, 'Times New Roman', serif;
      }

      /* -------------------------------------------------------
         Global scrollbar — slate-900 track, slate-600 thumb
      ------------------------------------------------------- */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; /* slate-900 */
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; /* slate-600 */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; /* slate-500 */
      }

      /* Legacy scoped scrollbar (kept for compatibility) */
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #0f172a;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }

      /* -------------------------------------------------------
         AI generation loading — quill-writing pulse
      ------------------------------------------------------- */
      @keyframes quill-writing {
        0%, 100% { opacity: 0.3; }
        50%       { opacity: 1;   }
      }
      .animate-quill {
        animation: quill-writing 1.5s ease-in-out infinite;
      }

      /* -------------------------------------------------------
         View / panel fade-in
      ------------------------------------------------------- */
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0);   }
      }
      .animate-fade-in {
        animation: fade-in 0.2s ease-out;
      }

      /* -------------------------------------------------------
         Warm amber focus glow for inputs and textareas
      ------------------------------------------------------- */
      .focus-amber:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px #78350f, 0 0 0 4px #f59e0b40;
      }

      /* -------------------------------------------------------
         Parchment-texture card background
      ------------------------------------------------------- */
      .card-parchment {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        position: relative;
        overflow: hidden;
      }
      .card-parchment::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 30% 40%, rgba(251, 191, 36, 0.02), transparent 60%);
        pointer-events: none;
      }

      /* -------------------------------------------------------
         tailwindcss-animate polyfill — animate-in + modifiers
         (kept hand-rolled to avoid adding the tailwindcss-animate
         plugin as a new dependency; see utils/demoTemplates.ts-adjacent
         wp-i2 notes)
      ------------------------------------------------------- */
      @keyframes tw-fade-in   { from { opacity: 0; }             to { opacity: 1; }            }
      @keyframes tw-zoom-in   { from { transform: scale(0.95); } to { transform: scale(1); }   }
      @keyframes tw-slide-in-from-bottom-2  { from { transform: translateY(0.5rem); }  to { transform: translateY(0); } }
      @keyframes tw-slide-in-from-bottom-4  { from { transform: translateY(1rem); }    to { transform: translateY(0); } }
      @keyframes tw-slide-in-from-bottom-8  { from { transform: translateY(2rem); }    to { transform: translateY(0); } }
      @keyframes tw-slide-in-from-bottom-10 { from { transform: translateY(2.5rem); }  to { transform: translateY(0); } }
      @keyframes tw-slide-in-from-right     { from { transform: translateX(100%); }    to { transform: translateX(0); } }
      @keyframes tw-slide-in-from-top-2     { from { transform: translateY(-0.5rem); } to { transform: translateY(0); } }
      @keyframes tw-slide-in-from-top-5     { from { transform: translateY(-1.25rem); } to { transform: translateY(0); } }

      /* Base .animate-in: no-op; modifier classes below apply the animation. */
      .animate-in { animation-fill-mode: both; }

      /* Modifier classes that combine with .animate-in */
      .animate-in.fade-in            { animation-name: tw-fade-in; }
      .animate-in.zoom-in-95         { animation-name: tw-fade-in, tw-zoom-in; }
      .animate-in.slide-in-from-bottom-2  { animation-name: tw-fade-in, tw-slide-in-from-bottom-2; }
      .animate-in.slide-in-from-bottom-4  { animation-name: tw-fade-in, tw-slide-in-from-bottom-4; }
      .animate-in.slide-in-from-bottom-8  { animation-name: tw-fade-in, tw-slide-in-from-bottom-8; }
      .animate-in.slide-in-from-bottom-10 { animation-name: tw-fade-in, tw-slide-in-from-bottom-10; }
      .animate-in.slide-in-from-right     { animation-name: tw-fade-in, tw-slide-in-from-right; }
      .animate-in.slide-in-from-top-2     { animation-name: tw-fade-in, tw-slide-in-from-top-2; }
      .animate-in.slide-in-from-top-5     { animation-name: tw-fade-in, tw-slide-in-from-top-5; }

      /* Duration helpers */
      .duration-150 { animation-duration: 150ms; }
      .duration-200 { animation-duration: 200ms; }
      .duration-300 { animation-duration: 300ms; }
      .duration-500 { animation-duration: 500ms; }
    </style>
  </head>
  <body class="bg-slate-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
